<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SFL - NEW</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<style>
/* Layout: one phone-width column, a logbook page. Black rules, big condensed numerals, red only for the thing to act on. */
:root{
  --paper:#ffffff; --ink:#0c0c0d; --red:#cc0000; --mute:#66666c; --line:#dcdcdf; --wash:#f4f4f5; --hdr:#000000; --r:7px;
  --display:"Special Elite","Courier New",Courier,monospace;
  --body:"Special Elite","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.app{max-width:460px;margin:0 auto;padding-inline:18px;padding-block:18px 96px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0}
.brand{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:8px}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:400}
.hero{display:flex;flex-direction:column;gap:2px}
.hero h1{font-family:var(--display);font-weight:400;font-size:68px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.hero h1 i{font-style:normal;color:var(--red)}
.sub{color:var(--red);font-size:14px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .mv{font-family:var(--display);font-weight:400;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.row .nm{font-size:13px;color:var(--red)}
.row .wt{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;text-align:right}
.row .tg{font-size:13px;text-align:right;color:var(--red)}
.row .tg b{color:var(--ink);font-weight:400}
.quote{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;text-transform:uppercase;border-left:5px solid var(--red);padding-left:12px;text-wrap:balance}
.btn{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:14px 16px;width:100%;cursor:pointer;border-radius:var(--r)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{font-size:16px;padding:8px 12px;width:auto}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:10px;width:100%;text-transform:none;letter-spacing:0;font-weight:400}
textarea{min-height:76px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:16px}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button,.seg button{font-family:var(--display);font-weight:400;font-size:20px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 0;cursor:pointer;border-radius:var(--r)}
.feel button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sets{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.set{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.set .n{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:400}
.set .w{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.set .w small{font-size:16px;font-weight:400;color:var(--mute);margin-left:3px}
.set .r{font-size:14px;color:var(--red);text-align:right}
.set.top .w{color:var(--red);font-size:42px}
.set.top .r{color:var(--ink);font-weight:400}
.step{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;border:2px solid var(--ink)}
.step button{font-family:var(--display);font-size:36px;font-weight:400;background:var(--paper);color:var(--ink);border:0;height:64px;cursor:pointer}
.step output{font-family:var(--display);font-weight:400;font-size:52px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-size:14px;padding:10px 12px;background:var(--wash);border-left:5px solid var(--ink)}
.verdict.up{border-color:var(--red)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;background:var(--line)}
.prog i.on{background:var(--ink)}
.note{font-size:13px;color:var(--red)}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;border:1px solid var(--ink);padding:2px 6px}
.tag.red{border-color:var(--red);color:var(--red)}
.card{border:1.5px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.card ul{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exrow{display:grid;grid-template-columns:1fr 76px 86px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow .mv{font-family:var(--display);font-weight:400;font-size:17px;text-transform:uppercase;min-width:0}
.exrow label{font-size:10px}
.exrow input{padding:8px 6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:15px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--display);font-size:10px;fill:var(--mute)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--ink)}
.chart .end{fill:var(--red)}
.chart text.endt{fill:var(--red);font-size:12px}
.step,.verdict,.tag,.card,.stamp,.set.top{border-radius:var(--r)}
.step{overflow:hidden}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr)}
.hdr div{max-width:460px;margin:0 auto;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.hdr img{flex:1 1 0;min-width:0;width:50%;max-height:58px;object-fit:contain;display:block}
.hdr img.sig{object-position:left center}
.hdr img.logo{object-position:right center}
.shot{width:100%;height:auto;display:block;border:2px solid var(--ink);border-radius:var(--r)}
.fl{position:fixed;inset:0;background:var(--red);z-index:8;pointer-events:none;animation:fl .4s ease-out both}
.fl.long{animation-duration:1.2s}
.safe{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.safe-c{background:var(--paper);border-top:8px solid var(--red);border-radius:var(--r);max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.safe-c h2{font-family:var(--display);font-weight:400;font-size:34px;text-transform:uppercase;color:var(--red);margin:0;line-height:1}
.tribe .safe-c h2{color:var(--ink);font-size:30px;line-height:1.1}.tribe .safe-c h2 i{font-style:normal;color:var(--red)}.tribe .tgb{font-size:16px;gap:10px}.tribe .sigl{display:block;width:180px;max-width:60%;height:auto;background:#000;border-radius:var(--r);padding:6px 10px}a.btn{display:block;text-align:center;text-decoration:none}
.hair{font-family:var(--display);font-size:30px;line-height:1.05;text-transform:uppercase;background:#000;color:#fff;border-left:8px solid var(--red);border-radius:var(--r);padding:12px 14px;margin:0}.hair b{font-weight:400;color:#ff3b3b}.vid{aspect-ratio:16/9;background:#141414;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8a8a8a;font-size:13px;text-align:center;padding:10px}.vid button{width:64px;height:64px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;cursor:pointer}.vid video{width:100%;height:100%;border-radius:var(--r);background:#000}
.safe-c ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.35}
.ck{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);cursor:pointer;width:100%}
.ck i{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:18px;line-height:1}
.ck[aria-pressed="true"]{border-color:var(--red)}.ck[aria-pressed="true"] i{background:var(--red);border-color:var(--red);color:#fff}
.tgx{display:flex;flex-direction:column;gap:14px;min-height:46vh;justify-content:center}
.tgx h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;text-transform:uppercase;margin:0}
.tgb{display:flex;flex-direction:column;gap:12px;font-size:18px;line-height:1.45}.tgb p{margin:0}.tgb b{color:var(--red);font-weight:400}
.tgw{font-family:var(--display);font-size:64px;line-height:1;color:var(--red);white-space:nowrap}.tgw small{font-size:24px;color:var(--mute)}
.tgs{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0}
.spotrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:-8px}.spotrow .eyebrow{margin-right:auto}.spotrow a{display:block;border-radius:50%;box-shadow:0 3px 0 #2a2a2a,0 7px 10px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;text-decoration:none}.spotrow a:active{transform:translateY(3px);box-shadow:0 0 0 #2a2a2a,0 2px 4px rgba(0,0,0,.35)}.spotrow img,.spotrow b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid #000;background:#000;color:#fff;object-fit:cover}
.spotc{align-self:flex-end;position:relative;z-index:3;margin-bottom:-68px}
.spotc summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}.spotc summary::-webkit-details-marker{display:none}
.spotc summary b{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:24px;font-weight:400;font-family:sans-serif}
.spotc summary img{width:48px;height:48px;border-radius:50%;display:block;background:#000;border:2px solid #000;box-shadow:0 4px 0 #2a2a2a,0 9px 12px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}.spotc summary:active img,.spotc[open] summary img{transform:translateY(3px);box-shadow:0 1px 0 #2a2a2a,0 3px 5px rgba(0,0,0,.35)}
.spotc summary small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.spotc .pan{position:absolute;right:0;top:58px;width:min(280px,82vw);background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.spot summary{list-style:none;text-align:center;display:block}.spot summary::-webkit-details-marker{display:none}.spot[open] summary{background:var(--paper);color:var(--ink)}
.set .w{white-space:nowrap}.set.top .w.bwl{font-size:30px}
.rov{position:fixed;inset:0;z-index:7;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--display);text-transform:uppercase;text-align:center;cursor:pointer;padding:20px}
.rov small{font-size:20px;letter-spacing:.2em;color:var(--red)}
.rov b{font-weight:400;font-size:min(34vw,190px);line-height:1;font-variant-numeric:tabular-nums}
.rov span{font-size:15px;letter-spacing:.1em;opacity:.75}
.rov i{position:absolute;left:0;bottom:0;height:12px;background:var(--red)}
.rov.go small{color:#fff}.rov.r b{color:var(--red)}.rov.a b,.rov.a small{color:#ffb000}.rov.a i{background:#ffb000}
.rov.go{background:#12963a}.rov.go i{background:#fff}.rov.go b{font-size:min(44vw,240px)}
@keyframes fl{from{opacity:.9}to{opacity:0}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;padding:14px 0;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 4px 0 var(--red)}

<script>
/* ---------- progression engine (pure functions, same for every exercise) ---------- */
const rnd = x => Math.sign(x) * Math.round(Math.abs(x));            // Sheets ROUND
let BWKG = 80;                                  // member bodyweight: dips and pull ups load is bodyweight PLUS added weight
const ref = ex => ex.bw ? BWKG : ex.start;      // bodyweight lifts step in plate increments from bodyweight
const bwt = d => { d = Math.round(d * 100) / 100; return d === 0 ? 'BW' : d > 0 ? 'BW + ' + d : 'BW \u2212 ' + (-d); };
const show = (ex, w) => ex.bw ? bwt(w - BWKG) + (Math.abs(w - BWKG) < .005 ? '' : ' kg') : Math.round(w * 100) / 100 + ' kg';
const showS = (ex, w) => ex.bw ? bwt(w - BWKG) + (Math.abs(w - BWKG) < .005 ? '' : '<small>kg</small>') : Math.round(w * 100) / 100 + '<small>kg</small>';
const eshow = (e, w) => e.bwk ? bwt(w - e.bwk) + (Math.abs(w - e.bwk) < .005 ? '' : ' kg') : Math.round(w * 100) / 100 + ' kg';
const fl = (x, ex) => Math.floor((x - ref(ex)) / ex.inc + 1e-9) * ex.inc + ref(ex);   // always round DOWN to the equipment increment
const work = ex => fl(ex.adj, ex);
function warm(ex, f) { return ex.bw ? fl(work(ex) * f, ex) : Math.floor(work(ex) * f / ex.inc + 1e-9) * ex.inc; }   // warm-ups: % of today's top set, rounded down
function nextLoad(ex, reps, S) {
  const w = work(ex);
  if (S.rule === 'sheet') {                                          // AB5: pct per rep either side of target, capped at 3
    const d = Math.max(-3, Math.min(3, reps - S.trigger));
    return { adj: ex.adj * (1 + S.pctSheet / 100 * d), dir: Math.sign(d) };
  }
  const upAt = ex.r711 ? 11 : S.trigger, downBelow = ex.r711 ? 7 : (S.dropBelow ?? 5);   // 7-11 rule: hit 11 goes up, miss 7 goes down
  if (reps >= upAt) {
    // SAFETY RULE: the bar never shows more than 5% above today's weight, and always rounds down.
    const cap = S.capPct ?? 5, p = Math.min(cap, S.pctM7 + (S.pctExtra ?? 2.5) * Math.min(3, reps - upAt)) / 100;
    const capW = fl(w * (1 + cap / 100), ex);
    let adj = ex.adj * (1 + p);
    adj = capW > w ? Math.min(adj, capW + ex.inc - 1e-6)      // normal lift: clip to the 5% ceiling
                   : Math.min(adj, w + 2 * ex.inc - 1e-6);    // light lift: 5% is under one plate step, so bank hits until one step is earned
    const up = fl(adj, ex) > w;
    return { adj, dir: up ? 1 : 0, banked: !up };
  }
  if (reps < downBelow) return { adj: ex.adj * (1 - S.pctM7 / 100), dir: -1 };
  return { adj: ex.adj, dir: 0 };
}
const kg = n => String(Math.round(n * 100) / 100);

/* ---------- state ---------- */
const APP_NAME = 'SFL - NEW', APP_VERSION = 'v1.0';   // release channel and version
const KEY = 'sfl-new-v1';
const QUOTES = ['1% better every day', 'Just one more rep', 'Fail on seven. Come back stronger.', 'Strict reps or no reps'];
function seed() {
  const e = (id, s, mv, nm, inc, start, lastReps) => ({ id, s, mv, nm, inc, start, adj: start, lastW: start, lastReps });
  return {
    example: true, next: 'push', quote: 0,
    S: { rule: 'm7', trigger: 7, pctM7: 5, pctSheet: 2, phase: 1 },
    ex: [
      e('squat', 'push', 'Squat', 'Back Squat', 2.5, 100, 5),
      e('ohp', 'push', 'Shoulder Press', 'BB Overhead Press', 2.5, 45, 6),
      e('chest', 'push', 'Chest Press', 'Flat DB Bench', 2, 32, 4),
      e('dip', 'push', 'Dips', 'Weighted Dips', 2.5, 15, 6),
      e('hinge', 'pull', 'Deficit Hinge', 'SL Deficit', 2.5, 97.5, 5),
      e('pull', 'pull', 'Pull Up / Down', 'Weighted Chin Up', 2, 12, 6),
      e('row', 'pull', 'Row', 'Machine Row', 2.5, 57.5, 5),
      e('upright', 'pull', 'Upright Row', 'Cable Upright Row', 2.5, 30, 4)
    ],
    log: []
  };
}
let D;
try { D = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
if (!D || !D.ex) D = seed();
function bwInit() {                              // first run with bodyweight: dips and pull ups become bodyweight + added
  if (D.S.bodyweight == null) { D.S.bodyweight = 80; D.ex.forEach(x => { if (x.id === 'dip' || x.id === 'pull') { x.bw = true; x.start += 80; x.adj += 80; if (x.lastW != null) x.lastW += 80; } }); }
  BWKG = D.S.bodyweight;
}
bwInit();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (_) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const PROG = {
  pp: { name: 'Push / Pull', note: 'The standard Strength For Life split.', days: { push: ['squat', 'ohp', 'chest', 'dip'], pull: ['hinge', 'pull', 'row', 'upright'] } },
  hv: { name: 'H&V', note: 'Vertical and Horizontal: more lifts per session, with leg and arm finishers.', days: { vertical: ['squat', 'ohp', 'pull', 'upright', 'dip', 'legext'], horizontal: ['hinge', 'chest', 'row', 'legcurl', 'curl', 'pushdown'] } }

function progView() {

const INCS = [1, 1.25, 2, 2.5, 4, 5];
const TG_INTRO = [
  ['Strength test', "Let's find your numbers.", `<p>This sets your working weight for every lift you test.</p><p>One lift at a time. One step at a time.</p>`],
  ['First', 'Choose your version.', `<p>For each lift, pick the version you will use for this training block: barbell, dumbbell, machine, or your own.</p><p>Stick with it for the block, so your numbers mean something.</p>`],
  ['Then', 'Pick your test weight.', `<p>Choose a weight you believe you can lift for <b>7 reps to strict technical failure, but not 8</b>.</p><p>Be as accurate as possible <b>without over-reaching</b>. The app calculates your load on what you <b>can</b> do, not what you <b>say</b> you can do.</p><p>Your accuracy in predicting your working weight is <b>a key part of the test</b>.</p>`],
  ['Warm up', 'Two warm-up sets.', `<p><b>50%</b> of your test weight for <b>10 reps</b>. Rest <b>90 seconds</b>.</p><p><b>75%</b> for <b>8 reps</b>. Rest <b>2 minutes</b>.</p><p>The app works out the weights and runs the rest timer for you.</p>`],

function tguide() {
  const g = cur.tg, list = lst();
  if (g.k === 'intro') {
    const [eb, h, body] = TG_INTRO[g.p], last = g.p === TG_INTRO.length - 1;
    return `<header class="brand"><b>Strength test</b><span>${g.p + 1} of ${TG_INTRO.length}</span></header>
    <div class="prog">${TG_INTRO.map((_, i) => `<i class="${i <= g.p ? 'on' : ''}"></i>`).join('')}</div>
    <div class="tgx"><span class="eyebrow">${eb}</span><h2>${h}</h2><div class="tgb">${body}</div>
    ${last ? `<p class="note">Today: ${list.map(x => esc(x.mv)).join(' &middot; ')}</p>` : ''}</div>
    <button class="btn red" id="${last ? 'tg-start' : 'tg-next'}">${last ? 'Start the test' : 'Next'}</button>
    ${g.p ? '<button class="btn" id="tg-back">Back</button>' : '<button class="btn" id="back">Back</button>'}`;
  }
  const ex = list[cur.i], w = work(ex), head = `<header class="brand"><b>${esc(ex.mv)}</b><span>Lift ${cur.i + 1} of ${list.length}</span></header>
    <div class="prog">${list.map((_, i) => `<i class="${i <= cur.i ? 'on' : ''}"></i>`).join('')}</div>`;
  const big = (t, sub) => `<div class="tgw">${t}</div>${sub ? `<p class="tgs">${sub}</p>` : ''}`;
  if (g.k === 'var') { const vs = VAR[ex.id] || [], custom = !!ex.cust;
    return head + `<div class="tgx"><span class="eyebrow">Your version</span><h2>Which ${esc(ex.mv)} will you do this training block?</h2>
    <div class="stack" style="gap:8px">${vs.map((v, i) => `<button class="btn ${ex.nm === v[0] ? '' : 'ghost'}" data-var="${i}">${v[0]}</button>`).join('')}
    <label for="tvar-o">Other: type your exercise<input id="tvar-o" placeholder="e.g. Hack squat" value="${custom ? esc(ex.nm) : ''}"></label>
    <button class="btn ghost" id="tg-varo">Use my exercise</button></div></div>`; }
  if (g.k === 'inc') return head + `<div class="tgx"><span class="eyebrow">Your kit &middot; ${esc(ex.nm)}</span><h2>What is the smallest jump in weight?</h2>
    <div class="seg" style="grid-template-columns:repeat(3,1fr)">${INCS.map(v => `<button data-inc2="${v}" aria-pressed="${ex.inc === v}">${v} kg</button>`).join('')}</div>
    <p class="note">Barbell: the smallest pair of plates you can add, usually 2.5 kg. Dumbbells: the jump to the next pair. Machines: one plate on the stack.</p></div>
    <button class="btn red" id="tg-inc">Next</button>`;
  if (g.k === 'pick') return head + `<div class="tgx"><span class="eyebrow">Test weight &middot; ${esc(ex.nm)}</span><h2>What can you lift for 7 strict reps, but not 8?</h2>
    <label for="tpred">${ex.bw ? 'Added weight, kg (0 = bodyweight only)' : 'Test weight, kg'}<input id="tpred" type="number" step="${ex.inc}" min="0" inputmode="decimal" value="${kg(Math.max(0, ex.bw ? w - BWKG : w))}" style="font-size:34px;text-align:center;font-family:var(--display)"></label>
    <p class="note">${/dumbbell/i.test(ex.nm) ? 'Dumbbells: enter the weight of one dumbbell. ' : ''}Be as accurate as you can without over-reaching. Aim for a weight you can do for 7, as close to an AMRAP of 7 as possible. The app sets your load on what you can do, not what you say you can do.</p></div><button class="btn red" id="tg-pick">Next</button>`;
  if (g.k === 'w1') return head + (hairOn(ex) ? hairBox() : '') + `<div class="tgx"><span class="eyebrow">Warm-up 1 &middot; 50%</span>${big(showS(ex, warm(ex, .5)), '&times; 10 reps')}</div><button class="btn red" id="tg-w1">Done. Start 90 sec rest</button>`;
  if (g.k === 'w2') return head + (hairOn(ex) ? hairBox() : '') + `<div class="tgx"><span class="eyebrow">Warm-up 2 &middot; 75%</span>${big(showS(ex, warm(ex, .75)), '&times; 8 reps')}</div><button class="btn red" id="tg-w2">Done. Start 2 min rest</button>`;
  if (g.k === 'top') return head + (hairOn(ex) ? hairBox() : '') + `<div class="tgx"><span class="eyebrow">Test set</span>${big(showS(ex, w), 'As many strict reps as possible')}<p class="note">Stop at strict technical failure. The rep you cannot finish with perfect form does not count.</p></div><button class="btn red" id="tg-top">Set done</button>`;
  if (g.k === 'reps') return head + `<div class="tgx"><span class="eyebrow">Log it</span><h2>How many strict reps?</h2>
    <div class="step"><button id="r-minus" aria-label="One rep fewer">&minus;</button><output id="r-out">${cur.reps}</output><button id="r-plus" aria-label="One rep more">+</button></div></div><button class="btn red" id="tg-save">Save</button>`;
  const e = cur.e[cur.e.length - 1], lastLift = cur.i + 1 >= list.length;
  return head + `<div class="tgx"><span class="eyebrow">Your working weight</span>${big(showS(ex, e.nw), e.reps === D.S.trigger ? 'Spot on. You called it.' : e.reps > D.S.trigger ? `${e.reps} reps. Stronger than you thought.` : `${e.reps} reps. Set to what you can do today.`)}
    <p class="note">Prediction: ${e.reps === D.S.trigger ? 'bang on, 7 out of 7' : `off by ${Math.abs(e.reps - D.S.trigger)} rep${Math.abs(e.reps - D.S.trigger) === 1 ? '' : 's'}`}. This is your top set for ${esc(ex.nm)} next ${esc(cur.grp || D.next)} session. Hit ${D.S.trigger} and it goes up.</p></div>
    <button class="btn red" id="tg-cont">${lastLift ? 'Finish test session' : 'Next lift'}</button>`;
}
