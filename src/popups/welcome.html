<!-- WELCOME LIGHTBOX: shows when someone first lands -->
<div data-if="showWelcome" hidden>
<div role="dialog" aria-modal="true" aria-label="Welcome to the tribe" style="position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<button type="button" aria-label="Close" data-action="closeWelcome" style="position: absolute; inset: 0; border: none; background: rgba(0,0,0,.85); cursor: pointer"></button>
<div style="position: relative; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; background: #000000; border: 3px solid #cc0000; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.7)">
<div aria-label="Welcome..." style="background: #000000; color: #ffffff; text-align: left; padding: 18px 52px 8px 20px; font-size: clamp(32px, 8vw, 52px); line-height: 1.1; white-space: pre"><span aria-hidden="true" data-w-text></span><span aria-hidden="true" style="display: inline-block; width: 0.5em; height: 0.95em; margin-left: 3px; vertical-align: -0.1em; background: #cc0000; opacity: 1" data-w-cursor></span></div>
<button type="button" aria-label="Close welcome" data-action="closeWelcome" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff1a1a" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: center">
<div style="width: min(300px, 100%, calc((100vh - 360px) * 0.87)); min-width: 180px; display: flex; flex-direction: column; gap: 14px">
<button type="button" class="vsoon-btn" aria-label="Play Danny's welcome video" style="position: relative; display: grid; width: 100%; aspect-ratio: 1080 / 1252; padding: 0; margin: 0; border: 0; outline-offset: 4px; border-radius: 0; background: #000000; line-height: 0; cursor: pointer; overflow: hidden; -webkit-appearance: none; appearance: none">
<img src="/images/welcome-1.jpg" alt="" style="grid-area: 1 / 1; display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; opacity: 1; transition: opacity 2s ease" data-w-img="1">
<span aria-hidden="true" style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: rgba(204,0,0,.92); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.5)"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#ffffff"></path></svg></span>
<span class="vsoon" aria-live="polite"><span>Video coming soon. In the meantime, why not join the tribe on <img src="/images/skool.svg" alt="Skool" style="display:inline-block;height:1.05em;width:calc(1.05em*3.075);vertical-align:-0.15em"> and ask me anything there?</span></span></button>
<img src="/images/signature.png" alt="Danny Williams signature" style="display: block; width: 100%; height: auto">
</div>
<div class="jwrap" style="width:100%;margin:22px 0 0;align-self:stretch"><span class="pt" aria-hidden="true">👉</span><a class="join" href="https://www.skool.com/strengthforlife-5963" target="_blank" rel="noopener" data-action="closeWelcome"><span class="jt">Join the Tribe <b>FREE</b> on <img src="/images/skool.svg" alt="Skool"></span></a></div>
</div>
</div>
</div>
</div>
<script>
document.querySelectorAll('.vsoon-btn').forEach(function(b){b.addEventListener('click',function(){b.classList.add('soon')})});
</script>
