<style>
/* Layout: the banner sits on black and runs straight into the red join block. Single deliberate look taken from site.css, all rules scoped under .jtm so the module can drop into any page. */
:root{--red:#cc0000;--hot:#ff3b3b;--blk:#000000;--wht:#ffffff;--ink:#111111;--type:"Special Elite","Courier New",Courier,monospace;color-scheme:dark}
body{background:var(--blk);color:var(--wht);font-family:var(--type)}
.jtm *{box-sizing:border-box}
.jtm{font-family:var(--type)}
.jtm .sb{width:100%;min-height:1.2em;overflow:hidden;background:var(--blk);color:var(--wht);padding-block:20px;padding-left:max(16px,calc((100% - 1168px)/2),env(safe-area-inset-left,0px));padding-right:max(16px,calc((100% - 1168px)/2),env(safe-area-inset-right,0px));display:flex;align-items:center;font-size:24px;line-height:1.2}
.jtm .sb-track{flex:none;display:flex;align-items:center;white-space:pre}
.jtm .sb-cursor{display:inline-block;width:.55em;height:1em;margin-left:2px;background:var(--red)}
.jtm .sb-frozen{flex:1 1 auto;min-width:0;width:100%;display:flex;justify-content:center;align-items:center;white-space:nowrap;font-weight:700}
.jtm .sb-frozen .sb-cursor{vertical-align:-.12em}
.jtm .sb-red{color:var(--hot)}
.jtm .sb-fake{font-style:italic}
.jtm .sb-real{-webkit-text-stroke:.05em currentColor}
.jtm .line{height:1px;background:var(--red)}
.jtm .cta{background:var(--red)}
.jtm .in{max-width:1200px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.jtm h2{margin:0;line-height:1.05;font-weight:400;color:var(--wht);font-size:clamp(20px,8.4vw,70px);-webkit-text-stroke:.025em currentColor;text-wrap:balance}
.jtm p{margin:0;font-size:clamp(18px,2.2vw,26px);line-height:1.3;color:var(--wht)}
.jtm .small{font-size:15px;color:var(--wht)}
.jtm .jwrap{position:relative;width:100%;max-width:1168px;margin-top:18px}
.jtm .join{display:block;width:100%;background:var(--wht);color:var(--ink);border:2px solid var(--red);border-radius:10px;text-decoration:none;padding:clamp(14px,2.2vw,22px) 10px;container-type:inline-size;transition:transform .15s;box-shadow:0 0 18px rgba(255,255,255,.18)}
.jtm .join:hover{transform:translateY(-1px)}
.jtm .join:active{transform:scale(.98)}
.jtm .join:focus-visible{outline:3px solid var(--wht);outline-offset:3px}
.jtm .jt{display:flex;align-items:center;justify-content:center;gap:.3em;font-size:min(36px,5.9cqw);font-weight:700;line-height:1.1;white-space:nowrap}
.jtm .jt b{color:var(--red)}
.jtm .jt img{display:block;height:1.2em;width:auto}
.jtm .pt{position:absolute;z-index:2;left:clamp(20px,10%,110px);top:0;font-size:clamp(38px,7vw,64px);line-height:1;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));animation:jtmnudge 1s ease-in-out infinite}
@keyframes jtmnudge{0%,100%{transform:translate(-50%,-78%) rotate(55deg) translateX(-.12em)}45%{transform:translate(-50%,-78%) rotate(55deg) translateX(.1em) scale(1.06)}55%{transform:translate(-50%,-78%) rotate(55deg) translateX(.06em) scale(.94)}}
@media (prefers-reduced-motion:reduce){.jtm .pt{animation:none;transform:translate(-50%,-78%) rotate(55deg)}}
</style>

<script>
/* Module settings. bannerSpeed: letters a second. members: shows above 0. */
(function(){
  var CONFIG={bannerSpeed:15,members:0};
  var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SIGN_OFF='F**K FAKE. GET REAL. RESULTS.',measureCtx=null;
  function initBanner(box) {
    var raw = box.getAttribute('data-line') || '';
    var segs = raw.split('**').map(function (t, k) { return { text: t, style: k % 2 ? 'red' : 'plain', line: true }; })
      .filter(function (x) { return x.text.length; });
    if (segs.length) { segs[segs.length - 1].gap = true; }
    var script = segs.concat([
      { text: 'F**K ', style: 'plain' }, { text: 'FAKE', style: 'fake' }, { text: '. GET ', style: 'plain' },
      { text: 'REAL', style: 'real' }, { text: '. ', style: 'plain' }, { text: 'RESULTS.', style: 'results' }
    ]);
    var total = script.reduce(function (n, p) { return n + p.text.length; }, 0);
    var lineLen = segs.reduce(function (a, x) { return a + x.text.length; }, 0);
    var b = { n: 0, wait: 0, on: true, done: false, started: false, timer: null };
    var track, cursor;

    function sizeText() {
      var cs = window.getComputedStyle(box);
      var avail = box.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      if (avail <= 0) { return; }
      if (!measureCtx) { measureCtx = document.createElement('canvas').getContext('2d'); }
      measureCtx.font = "700 100px 'Special Elite', 'Courier New', monospace";
      var perPx = measureCtx.measureText(SIGN_OFF).width / 100 + 0.62;
      box.style.fontSize = Math.max(12, Math.floor((avail / perPx) * 0.97)) + 'px';
    }
    function fit() {
      if (!track) { return; }
      var cs = window.getComputedStyle(box);
      var room = box.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      var over = track.offsetWidth - room;
      track.style.transform = 'translateX(' + (over > 0 ? -over : 0) + 'px)';
    }
    function draw() {
      box.textContent = '';
      cursor = document.createElement('span');
      cursor.className = 'sb-cursor';
      cursor.style.opacity = b.on ? '1' : '0';
      if (b.done) {
        track = null;
        var frozen = document.createElement('div');
        frozen.className = 'sb-frozen';
        frozen.setAttribute('aria-hidden', 'true');
        frozen.innerHTML = '<span>F**K <span class="sb-fake">FAKE</span>. GET <span class="sb-real">REAL</span>. <span class="sb-red">RESULTS.</span></span>';
        frozen.firstChild.appendChild(cursor);
        box.appendChild(frozen);
        return;
      }
      track = document.createElement('div');
      track.className = 'sb-track';
      track.setAttribute('aria-hidden', 'true');
      var left = b.n;
      script.forEach(function (p) {
        if (left <= 0) { return; }
        var shown = p.text.slice(0, left);
        left -= shown.length;
        var s = document.createElement('span');
        s.textContent = shown;
        if (p.style === 'red' || p.style === 'results') { s.className = 'sb-red'; }
        if (p.style === 'fake') { s.className = 'sb-fake'; }
        if (p.style === 'real') { s.className = 'sb-real'; }
        s.style.fontWeight = p.line ? '400' : '700';
        if (p.gap && shown.length === p.text.length) { s.style.paddingRight = '0.6em'; }
        track.appendChild(s);
      });
      track.appendChild(cursor);
      box.appendChild(track);
      fit();
    }
    function stop() { if (b.timer) { clearInterval(b.timer); b.timer = null; } }
    function tick() {
      if (b.wait > 0) { b.wait--; return; }
      b.n++;
      if (b.n >= total) { stop(); b.n = total; b.on = true; b.done = true; draw(); return; }
      b.on = true;
      b.wait = b.n === lineLen ? Math.round(CONFIG.bannerSpeed * 0.6) : 0;
      draw();
    }
    function restart() {
      stop();
      if (reduceMotion) { b.n = total; b.done = true; b.on = true; draw(); return; }
      b.n = 0; b.wait = 0; b.on = true; b.done = false; draw();
      b.timer = setInterval(tick, Math.max(15, 1000 / CONFIG.bannerSpeed));
    }

    // Cursor blinks all the time.
    setInterval(function () { b.on = !b.on; if (cursor) { cursor.style.opacity = b.on ? '1' : '0'; } }, 500);
    sizeText();
    draw();
    // Type it out each time it scrolls into view; reset when it leaves.
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting && !b.started) { b.started = true; restart(); }
          else if (!e.isIntersecting && b.started) { b.started = false; stop(); b.n = 0; b.wait = 0; b.on = true; b.done = false; draw(); }
        });
      }, { threshold: [0, 0.6] }).observe(box);
    } else {
      b.started = true; restart();
    }
    return { resize: function () { sizeText(); fit(); } };
  }

  var banners=[].slice.call(document.querySelectorAll('.jtm .sb')).map(initBanner);
  function layout(){banners.forEach(function(b){b.resize()})}
  addEventListener('resize',layout);layout();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  var m=document.querySelector('.jtm [data-members]');
  if(m&&CONFIG.members>0)m.textContent=CONFIG.members.toLocaleString('en-GB')+' already in. ';
})();
</script>
